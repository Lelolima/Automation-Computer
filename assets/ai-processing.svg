<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6b21d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d421a8;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="pulseGrad">
      <stop offset="0%" style="stop-color:#6b21d4;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#6b21d4;stop-opacity:0" />
    </radialGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#aiBg)"/>

  <!-- Neural Network Background -->
  <g opacity="0.3">
    <circle cx="100" cy="100" r="3" fill="#6b21d4"/>
    <circle cx="200" cy="150" r="3" fill="#6b21d4"/>
    <circle cx="150" cy="250" r="3" fill="#6b21d4"/>
    <circle cx="300" cy="200" r="3" fill="#6b21d4"/>
    <circle cx="250" cy="350" r="3" fill="#6b21d4"/>
    <circle cx="400" cy="300" r="3" fill="#6b21d4"/>
    <circle cx="350" cy="450" r="3" fill="#6b21d4"/>

    <line x1="100" y1="100" x2="200" y2="150" stroke="#6b21d4" stroke-width="1">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="200" y1="150" x2="150" y2="250" stroke="#6b21d4" stroke-width="1">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="150" y1="250" x2="300" y2="200" stroke="#6b21d4" stroke-width="1">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.5s" repeatCount="indefinite"/>
    </line>
    <line x1="300" y1="200" x2="250" y2="350" stroke="#6b21d4" stroke-width="1">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="250" y1="350" x2="400" y2="300" stroke="#6b21d4" stroke-width="1">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.8s" repeatCount="indefinite"/>
    </line>
    <line x1="400" y1="300" x2="350" y2="450" stroke="#6b21d4" stroke-width="1">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Central Brain/AI Icon -->
  <g transform="translate(400, 250)">
    <!-- Outer pulse rings -->
    <circle r="120" fill="none" stroke="url(#pulseGrad)" stroke-width="2">
      <animate attributeName="r" values="80;120;80" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="100" fill="none" stroke="url(#pulseGrad)" stroke-width="2">
      <animate attributeName="r" values="60;100;60" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Brain core -->
    <ellipse cx="0" cy="0" rx="50" ry="60" fill="url(#brainGrad)" filter="url(#neonGlow)"/>
    <ellipse cx="-15" cy="-10" rx="12" ry="20" fill="#8b41d4"/>
    <ellipse cx="15" cy="-10" rx="12" ry="20" fill="#8b41d4"/>
    <ellipse cx="-15" cy="15" rx="12" ry="18" fill="#8b41d4"/>
    <ellipse cx="15" cy="15" rx="12" ry="18" fill="#8b41d4"/>
    <ellipse cx="0" cy="35" rx="15" ry="12" fill="#8b41d4"/>

    <!-- Neural connections -->
    <circle cx="-20" cy="-15" r="3" fill="#d421a8">
      <animate attributeName="r" values="3;5;3" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="-15" r="3" fill="#d421a8">
      <animate attributeName="r" values="3;5;3" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-20" cy="20" r="3" fill="#d421a8">
      <animate attributeName="r" values="3;5;3" dur="1.5s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="20" r="3" fill="#d421a8">
      <animate attributeName="r" values="3;5;3" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="40" r="3" fill="#d421a8">
      <animate attributeName="r" values="3;5;3" dur="1.5s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Input Task Bubble -->
  <g transform="translate(100, 120)">
    <rect x="-80" y="-40" width="160" height="80" rx="15" fill="#1a1a2e" stroke="#6b21d4" stroke-width="2"/>
    <text x="0" y="-10" fill="#ffffff" font-family="Arial" font-size="12" text-anchor="middle">Tarefa:</text>
    <text x="0" y="15" fill="#00d4aa" font-family="Consolas" font-size="10" text-anchor="middle">"Extraia dados do site"</text>
    <!-- Arrow to brain -->
    <path d="M80 0 L150 200" stroke="#6b21d4" stroke-width="2" fill="none" marker-end="url(#arrowhead)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Processing indicators around brain -->
  <g transform="translate(400, 250)">
    <g transform="translate(-80, -100)">
      <circle r="20" fill="#1a1a2e" stroke="#00d4aa" stroke-width="2"/>
      <text x="0" y="5" fill="#00d4aa" font-family="Arial" font-size="10" text-anchor="middle">NLP</text>
      <animateTransform attributeName="transform" type="rotate" from="-30 -80 -100" to="30 -80 -100" dur="2s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(80, -80)">
      <circle r="20" fill="#1a1a2e" stroke="#d421a8" stroke-width="2"/>
      <text x="0" y="5" fill="#d421a8" font-family="Arial" font-size="10" text-anchor="middle">Plan</text>
      <animateTransform attributeName="transform" type="rotate" from="30 80 -80" to="-30 80 -80" dur="2.5s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(-60, 80)">
      <circle r="20" fill="#1a1a2e" stroke="#ffbd2e" stroke-width="2"/>
      <text x="0" y="5" fill="#ffbd2e" font-family="Arial" font-size="10" text-anchor="middle">Execute</text>
      <animateTransform attributeName="transform" type="rotate" from="-20 -60 80" to="20 -60 80" dur="3s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(70, 90)">
      <circle r="20" fill="#1a1a2e" stroke="#27ca40" stroke-width="2"/>
      <text x="0" y="5" fill="#27ca40" font-family="Arial" font-size="10" text-anchor="middle">Learn</text>
      <animateTransform attributeName="transform" type="rotate" from="25 70 90" to="-25 70 90" dur="2.8s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Output Bubble -->
  <g transform="translate(650, 380)">
    <rect x="-70" y="-30" width="140" height="60" rx="15" fill="#1a1a2e" stroke="#27ca40" stroke-width="2"/>
    <text x="0" y="-5" fill="#ffffff" font-family="Arial" font-size="11" text-anchor="middle">Plano Gerado:</text>
    <text x="0" y="15" fill="#27ca40" font-family="Consolas" font-size="9" text-anchor="middle">1. Abrir browser</text>
    <text x="0" y="28" fill="#27ca40" font-family="Consolas" font-size="9" text-anchor="middle">2. Navegar → Extrair → Salvar</text>
  </g>

  <!-- Provider badges -->
  <g transform="translate(150, 420)">
    <rect x="0" y="0" width="70" height="30" rx="5" fill="#0d1117" stroke="#3776ab" stroke-width="1"/>
    <text x="35" y="20" fill="#3776ab" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">Python</text>
  </g>

  <g transform="translate(240, 420)">
    <rect x="0" y="0" width="60" height="30" rx="5" fill="#0d1117" stroke="#e94560" stroke-width="1"/>
    <text x="30" y="20" fill="#e94560" font-family="Arial" font-size="9" text-anchor="middle" font-weight="bold">Claude</text>
  </g>

  <g transform="translate(320, 420)">
    <rect x="0" y="0" width="70" height="30" rx="5" fill="#0d1117" stroke="#27ca40" stroke-width="1"/>
    <text x="35" y="20" fill="#27ca40" font-family="Arial" font-size="9" text-anchor="middle" font-weight="bold">Ollama</text>
  </g>

  <g transform="translate(410, 420)">
    <rect x="0" y="0" width="70" height="30" rx="5" fill="#0d1117" stroke="#00d4aa" stroke-width="1"/>
    <text x="35" y="20" fill="#00d4aa" font-family="Arial" font-size="9" text-anchor="middle" font-weight="bold">GPT-4</text>
  </g>

  <!-- Status: Processing -->
  <g transform="translate(600, 50)">
    <circle r="25" fill="#1a1a2e" stroke="#6b21d4" stroke-width="2"/>
    <path d="M-15 0 A15 15 0 1 1 15 0" stroke="#6b21d4" stroke-width="3" fill="none" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <text x="0" y="5" fill="#6b21d4" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold">AI</text>
  </g>
  <text x="600" y="90" fill="#8888aa" font-family="Arial" font-size="11" text-anchor="middle">Processando...</text>

  <!-- Token counter -->
  <g transform="translate(700, 100)">
    <text x="0" y="0" fill="#8888aa" font-family="Consolas" font-size="10">Tokens:</text>
    <text x="50" y="0" fill="#d421a8" font-family="Consolas" font-size="14" font-weight="bold">
      <animate attributeName="textContent" values="128;156;189;234;287;356;423;489;512;534" dur="10s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>