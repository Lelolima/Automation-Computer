<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#12121f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3776ab;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a4a6e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b2a3a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nodeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27ca40;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a6b2a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nodeGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#006b55;stop-opacity:1" />
    </linearGradient>
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="flowArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a4a6a" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#flowBg)"/>

  <!-- Title -->
  <text x="400" y="40" fill="#ffffff" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">
    Automation-Computer
    <tspan x="400" dy="20" font-size="12" font-weight="normal" fill="#8888aa">Arquitetura do Sistema</tspan>
  </text>

  <!-- User Input Node -->
  <g transform="translate(100, 120)">
    <rect x="-60" y="-40" width="120" height="80" rx="10" fill="url(#nodeGrad1)" filter="url(#nodeGlow)"/>
    <text x="0" y="-10" fill="#ffffff" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Usuário</text>
    <text x="0" y="15" fill="#ccccff" font-family="Consolas" font-size="10" text-anchor="middle">CLI / API</text>

    <!-- Pulse animation -->
    <rect x="-60" y="-40" width="120" height="80" rx="10" fill="none" stroke="#3776ab" stroke-width="2">
      <animate attributeName="stroke-opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Orchestrator Node -->
  <g transform="translate(320, 120)">
    <rect x="-70" y="-50" width="140" height="100" rx="10" fill="url(#nodeGrad2)" filter="url(#nodeGlow)"/>
    <text x="0" y="-20" fill="#ffffff" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Core</text>
    <text x="0" y="5" fill="#ffcccc" font-family="Consolas" font-size="10" text-anchor="middle">Automation</text>
    <text x="0" y="20" fill="#ffcccc" font-family="Consolas" font-size="10" text-anchor="middle">Orchestrator</text>

    <!-- Processing animation -->
    <circle r="60" fill="none" stroke="#e94560" stroke-width="2" stroke-dasharray="10,5">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Modules Row -->
  <!-- Desktop Module -->
  <g transform="translate(100, 300)">
    <rect x="-50" y="-35" width="100" height="70" rx="8" fill="url(#nodeGrad3)"/>
    <text x="0" y="-10" fill="#ffffff" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Desktop</text>
    <text x="0" y="10" fill="#ccffcc" font-family="Consolas" font-size="8" text-anchor="middle">pywinauto</text>
    <text x="0" y="22" fill="#ccffcc" font-family="Consolas" font-size="8" text-anchor="middle">pynput</text>

    <!-- Active indicator -->
    <circle r="5" cx="40" cy="-30" fill="#27ca40">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Web Module -->
  <g transform="translate(260, 300)">
    <rect x="-50" y="-35" width="100" height="70" rx="8" fill="#2eada6"/>
    <text x="0" y="-10" fill="#ffffff" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Web</text>
    <text x="0" y="10" fill="#e0ffff" font-family="Consolas" font-size="8" text-anchor="middle">Playwright</text>
    <text x="0" y="22" fill="#e0ffff" font-family="Consolas" font-size="8" text-anchor="middle">Async</text>

    <!-- Active indicator -->
    <circle r="5" cx="40" cy="-30" fill="#ffffff">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- AI Module -->
  <g transform="translate(420, 300)">
    <rect x="-50" y="-35" width="100" height="70" rx="8" fill="#8b41d4"/>
    <text x="0" y="-10" fill="#ffffff" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">AI / LLM</text>
    <text x="0" y="10" fill="#e8ccff" font-family="Consolas" font-size="8" text-anchor="middle">Claude/GPT</text>
    <text x="0" y="22" fill="#e8ccff" font-family="Consolas" font-size="8" text-anchor="middle">Ollama</text>

    <!-- Active indicator -->
    <circle r="5" cx="40" cy="-30" fill="#d421a8">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Security Module -->
  <g transform="translate(580, 300)">
    <rect x="-50" y="-35" width="100" height="70" rx="8" fill="#6b5c2a"/>
    <text x="0" y="-10" fill="#ffffff" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Security</text>
    <text x="0" y="10" fill="#ffffcc" font-family="Consolas" font-size="8" text-anchor="middle">Fernet</text>
    <text x="0" y="22" fill="#ffffcc" font-family="Consolas" font-size="8" text-anchor="middle">bcrypt</text>

    <!-- Active indicator -->
    <circle r="5" cx="40" cy="-30" fill="#ffd700">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Output Node -->
  <g transform="translate(700, 120)">
    <rect x="-60" y="-40" width="120" height="80" rx="10" fill="url(#nodeGrad4)" filter="url(#nodeGlow)"/>
    <text x="0" y="-10" fill="#ffffff" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Saída</text>
    <text x="0" y="15" fill="#ccffff" font-family="Consolas" font-size="10" text-anchor="middle">Dados/JSON</text>

    <!-- Success indicator -->
    <path d="M-10 10 L0 20 L15 -5" stroke="#ffffff" stroke-width="3" fill="none">
      <animate attributeName="stroke-dasharray" values="0,50;50,50" dur="0.5s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1" dur="0.3s" fill="freeze"/>
    </path>
  </g>

  <!-- Flow Lines -->
  <!-- User to Core -->
  <path d="M160 120 L230 120" stroke="#4a4a6a" stroke-width="3" marker-end="url(#flowArrow)">
    <animate attributeName="stroke-dasharray" values="0,100;100,100" dur="1s" fill="freeze"/>
  </path>
  <!-- Animated data packet -->
  <circle r="5" fill="#3776ab">
    <animate attributeName="cx" values="160;230" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="120;120" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Core to Modules (split) -->
  <path d="M390 120 L390 200 L100 200 L100 250" stroke="#4a4a6a" stroke-width="2" stroke-dasharray="5,5" fill="none" opacity="0.5"/>
  <path d="M390 120 L390 200 L260 200 L260 250" stroke="#4a4a6a" stroke-width="2" stroke-dasharray="5,5" fill="none" opacity="0.5"/>
  <path d="M390 120 L390 200 L420 200 L420 250" stroke="#4a4a6a" stroke-width="2" stroke-dasharray="5,5" fill="none" opacity="0.5"/>
  <path d="M390 120 L390 200 L580 200 L580 250" stroke="#4a4a6a" stroke-width="2" stroke-dasharray="5,5" fill="none" opacity="0.5"/>

  <!-- Modules to Output -->
  <path d="M500 250 L700 250 L700 180" stroke="#4a4a6a" stroke-width="2" stroke-dasharray="5,5" fill="none" opacity="0.5"/>

  <!-- Data packets flowing -->
  <circle r="4" fill="#e94560">
    <animate attributeName="cx" values="100;100;260;420;580" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="200;250;250;250;250" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Legend -->
  <g transform="translate(50, 450)">
    <text x="0" y="0" fill="#8888aa" font-family="Arial" font-size="11">Legenda:</text>

    <rect x="80" y="-10" width="15" height="15" rx="3" fill="url(#nodeGrad1)"/>
    <text x="105" y="2" fill="#cccccc" font-family="Arial" font-size="10">Input</text>

    <rect x="180" y="-10" width="15" height="15" rx="3" fill="url(#nodeGrad2)"/>
    <text x="205" y="2" fill="#cccccc" font-family="Arial" font-size="10">Orquestração</text>

    <rect x="340" y="-10" width="15" height="15" rx="3" fill="url(#nodeGrad3)"/>
    <text x="365" y="2" fill="#cccccc" font-family="Arial" font-size="10">Módulos</text>

    <rect x="470" y="-10" width="15" height="15" rx="3" fill="url(#nodeGrad4)"/>
    <text x="495" y="2" fill="#cccccc" font-family="Arial" font-size="10">Output</text>

    <line x1="620" y1="-5" x2="650" y2="-5" stroke="#4a4a6a" stroke-width="2"/>
    <text x="660" y="2" fill="#cccccc" font-family="Arial" font-size="10">Fluxo de Dados</text>
  </g>

  <!-- Stats counters -->
  <g transform="translate(320, 450)">
    <text x="0" y="0" fill="#8888aa" font-family="Arial" font-size="10">Módulos Ativos:</text>
    <text x="90" y="0" fill="#27ca40" font-family="Arial" font-size="12" font-weight="bold">4</text>

    <text x="140" y="0" fill="#8888aa" font-family="Arial" font-size="10">|</text>

    <text x="160" y="0" fill="#8888aa" font-family="Arial" font-size="10">Tarefas Hoy:</text>
    <text x="240" y="0" fill="#00d4aa" font-family="Arial" font-size="12" font-weight="bold">
      <animate attributeName="textContent" values="0;5;12;23;45;67;89;102;127" dur="20s" repeatCount="indefinite"/>
    </text>

    <text x="300" y="0" fill="#8888aa" font-family="Arial" font-size="10">|</text>

    <text x="320" y="0" fill="#8888aa" font-family="Arial" font-size="10">Success Rate:</text>
    <text x="410" y="0" fill="#27ca40" font-family="Arial" font-size="12" font-weight="bold">99.9%</text>
  </g>
</svg>