<svg width="800" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" fill="url(#pipeBg)"/>

  <!-- Pipeline Title -->
  <text x="400" y="30" fill="#ffffff" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">
    Pipeline de Execução
  </text>

  <!-- Step 1: Input -->
  <g transform="translate(60, 100)">
    <rect x="-40" y="-40" width="80" height="80" rx="10" fill="url(#stepGrad)" stroke="#3776ab" stroke-width="2"/>
    <circle r="20" fill="none" stroke="#3776ab" stroke-width="2">
      <animate attributeName="stroke-dasharray" values="0,126;63,63" dur="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="-5" fill="#3776ab" font-family="Arial" font-size="20" text-anchor="middle">▶</text>
    <text x="0" y="25" fill="#ffffff" font-family="Arial" font-size="10" text-anchor="middle">INPUT</text>
    <text x="0" y="55" fill="#8888aa" font-family="Consolas" font-size="8" text-anchor="middle">CLI/API</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="100" y1="100" x2="140" y2="100" stroke="#4a4a6a" stroke-width="3">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite"/>
  </line>
  <polygon points="140,95 150,100 140,105" fill="#4a4a6a">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite"/>
  </polygon>

  <!-- Step 2: Parse -->
  <g transform="translate(190, 100)">
    <rect x="-40" y="-40" width="80" height="80" rx="10" fill="url(#stepGrad)" stroke="#e94560" stroke-width="2"/>
    <text x="0" y="-10" fill="#e94560" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">⚙</text>
    <text x="0" y="25" fill="#ffffff" font-family="Arial" font-size="10" text-anchor="middle">PARSE</text>
    <text x="0" y="55" fill="#8888aa" font-family="Consolas" font-size="8" text-anchor="middle">NLP</text>

    <!-- Rotating gear -->
    <text x="0" y="5" fill="#e94560" font-family="Arial" font-size="24" text-anchor="middle">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Arrow 2 -->
  <line x1="230" y1="100" x2="270" y2="100" stroke="#4a4a6a" stroke-width="3"/>

  <!-- Step 3: Plan -->
  <g transform="translate(320, 100)">
    <rect x="-40" y="-40" width="80" height="80" rx="10" fill="url(#stepGrad)" stroke="#8b41d4" stroke-width="2"/>
    <text x="0" y="-15" fill="#8b41d4" font-family="Arial" font-size="24" text-anchor="middle">📋</text>
    <text x="0" y="25" fill="#ffffff" font-family="Arial" font-size="10" text-anchor="middle">PLAN</text>
    <text x="0" y="55" fill="#8888aa" font-family="Consolas" font-size="8" text-anchor="middle">LLM</text>

    <!-- Generate animation -->
    <rect x="-35" y="-35" width="70" height="5" rx="2" fill="#8b41d4" opacity="0.5"/>
    <rect x="-35" y="-25" width="60" height="5" rx="2" fill="#8b41d4" opacity="0.5">
      <animate attributeName="width" values="0;60" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="-35" y="-15" width="50" height="5" rx="2" fill="#8b41d4" opacity="0.5">
      <animate attributeName="width" values="0;50" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Arrow 3 -->
  <line x1="360" y1="100" x2="400" y2="100" stroke="#4a4a6a" stroke-width="3"/>

  <!-- Step 4: Execute -->
  <g transform="translate(450, 100)">
    <rect x="-40" y="-40" width="80" height="80" rx="10" fill="url(#stepGrad)" stroke="#27ca40" stroke-width="2"/>
    <text x="0" y="-10" fill="#27ca40" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">▶</text>
    <text x="0" y="25" fill="#ffffff" font-family="Arial" font-size="10" text-anchor="middle">EXECUTE</text>
    <text x="0" y="55" fill="#8888aa" font-family="Consolas" font-size="8" text-anchor="middle">Actions</text>

    <!-- Progress bar -->
    <rect x="-30" y="35" width="60" height="6" rx="3" fill="#1a1a2e"/>
    <rect x="-28" y="37" width="56" height="2" rx="1" fill="#27ca40">
      <animate attributeName="width" values="0;56;0" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Arrow 4 -->
  <line x1="490" y1="100" x2="530" y2="100" stroke="#4a4a6a" stroke-width="3"/>

  <!-- Step 5: Output -->
  <g transform="translate(580, 100)">
    <rect x="-40" y="-40" width="80" height="80" rx="10" fill="url(#stepGrad)" stroke="#00d4aa" stroke-width="2"/>
    <text x="0" y="-10" fill="#00d4aa" font-family="Arial" font-size="20" text-anchor="middle">✓</text>
    <text x="0" y="25" fill="#ffffff" font-family="Arial" font-size="10" text-anchor="middle">OUTPUT</text>
    <text x="0" y="55" fill="#8888aa" font-family="Consolas" font-size="8" text-anchor="middle">JSON/Data</text>

    <!-- Success pulse -->
    <circle r="35" fill="none" stroke="#00d4aa" stroke-width="2">
      <animate attributeName="r" values="30;40;30" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Arrow 5 -->
  <line x1="620" y1="100" x2="660" y2="100" stroke="#4a4a6a" stroke-width="3"/>

  <!-- Step 6: Log -->
  <g transform="translate(710, 100)">
    <rect x="-40" y="-40" width="80" height="80" rx="10" fill="url(#stepGrad)" stroke="#ffd700" stroke-width="2"/>
    <text x="0" y="-10" fill="#ffd700" font-family="Arial" font-size="18" text-anchor="middle">📝</text>
    <text x="0" y="25" fill="#ffffff" font-family="Arial" font-size="10" text-anchor="middle">LOG</text>
    <text x="0" y="55" fill="#8888aa" font-family="Consolas" font-size="8" text-anchor="middle">Audit</text>

    <!-- Writing animation -->
    <line x1="-20" y1="-25" x2="20" y2="-25" stroke="#ffd700" stroke-width="2">
      <animate attributeName="x2" values="-20;20;-20" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="-20" y1="-15" x2="20" y2="-15" stroke="#ffd700" stroke-width="2">
      <animate attributeName="x2" values="-20;20;-20" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </line>
    <line x1="-20" y1="-5" x2="20" y2="-5" stroke="#ffd700" stroke-width="2">
      <animate attributeName="x2" values="-20;20;-20" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Timing info -->
  <g transform="translate(400, 240)">
    <text x="0" y="0" fill="#8888aa" font-family="Arial" font-size="11" text-anchor="middle">
      Tempo médio de execução:
      <tspan fill="#27ca40" font-weight="bold">
        <animate attributeName="textContent" values="0.5s;0.8s;1.2s;0.9s;0.7s;0.5s" dur="10s" repeatCount="indefinite"/>
      </tspan>
    </text>

    <text x="0" y="25" fill="#8888aa" font-family="Consolas" font-size="9" text-anchor="middle">
      INPUT → PARSE → PLAN → EXECUTE → OUTPUT → LOG
    </text>
  </g>

  <!-- Animated data flow line across bottom -->
  <line x1="60" y1="200" x2="740" y2="200" stroke="#4a4a6a" stroke-width="1" stroke-dasharray="10,5" opacity="0.3"/>

  <!-- Moving data packet -->
  <circle r="6" fill="#3776ab" opacity="0.8">
    <animate attributeName="cx" values="60;190;320;450;580;710;740" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="200;200;200;200;200;200" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>